name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # מופעל גם ידנית, וגם אוטומטית ע"י weekly-data.yml אחרי עדכון נתוני המניינים
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # פנייה ל-Secrets אינה זמינה ב-PR מ-fork; בלעדיהם נבנה APK דיבאג בלבד
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # ה-SDK מותקן מראש ב-ubuntu-latest (הפעולה android-actions/setup-android נכשלה על 'sdkmanager tools');
      # מספיק לאשר רישיונות
      - name: Accept Android SDK licenses
        run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)" --licenses > /dev/null || true

      - name: Bump version (versionCode/versionName)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Data date embedded in this build
        id: data
        run: echo "generated=$(python3 -c "import json;print(json.load(open('data/minyanim-israel.json',encoding='utf-8'))['generated'])")" >> "$GITHUB_OUTPUT"

      # --- חתימה קבועה (keystore ב-GitHub Secrets) ---
      - name: Restore signing keystore
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "MINYAN_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "MINYAN_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "MINYAN_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "MINYAN_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (no signing secrets - pull request from a fork)
        if: env.HAS_SIGNING != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify signature
        if: env.HAS_SIGNING == 'true'
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minyanim-krovim-apk
          path: app/build/outputs/apk/*/*.apk

      - name: Create GitHub Release with APK
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "מניינים קרובים - build #${{ github.run_number }}"
          body: |
            APK חתום (חתימה קבועה - מתעדכן מעל הגרסה הקודמת בלי הסרה).
            גרסה: versionCode ${{ github.run_number }}.
            נתוני המניינים המוטמעים: ${{ steps.data.outputs.generated }}.
            נבנה מקומיט ${{ github.sha }}.
          files: app/build/outputs/apk/release/*.apk
